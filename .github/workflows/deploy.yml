name: Build & deploy to GitHub Pages

# Собирает статический сайт из исходников (build.sh: шаблон + i18n.json + assets)
# и публикует на GitHub Pages при каждом пуше в main. TLS/домен — на стороне Pages
# (custom-домен берётся из dist/CNAME, который пишет build.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменять уже идущий деплой, чтобы страница не осталась полусобранной.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: build.sh derives sitemap <lastmod> from git commit dates

      - name: Install ImageMagick + WebP
        run: |
          # Drop third-party apt repos (packages.microsoft.com periodically ships an
          # unsigned InRelease that makes `apt-get update` exit 100). Ubuntu's own
          # repos carry imagemagick/webp, so tolerate an update failure and install.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* || true
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends imagemagick webp

      - name: Build site
        run: ./build.sh

      # Требует, чтобы владелец репо один раз выставил Settings → Pages → Source:
      # "GitHub Actions" (переключение build_type/cname доступно только admin —
      # ни PAT коллаборатора, ни github.token это сделать не могут, 403).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: мгновенно уведомляем Bing/Yandex/… обо ВСЕХ URL после деплоя.
      # Список строится из pages.gen.py (главная + все подстраницы, по-язычно) — само-
      # поддерживается, новые страницы попадают автоматически. Ключ — web/static/<key>.txt.
      - uses: actions/checkout@v4
      - name: Ping IndexNow
        run: |
          HOST=ingartstudio.es
          KEY=$(basename "$(ls static/*.txt | head -1)" .txt)
          python3 pages.gen.py >/dev/null 2>&1 || true
          URLS=$(python3 -c "import json;s='https://$HOST/';p=json.load(open('pages.json'))['pages'];print(json.dumps([s,s+'en/',s+'ru/']+[s+x['path'][c]+'/' for x in p for c in ('es','en','ru')]))")
          echo "IndexNow: submitting $(python3 -c "import json,sys;print(len(json.loads(sys.argv[1])))" "$URLS") URLs"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" \
            -w '\nIndexNow HTTP %{http_code}\n' || echo "IndexNow ping failed (non-fatal)"
